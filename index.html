<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/mcs-8-mchd-2-advanced-js-blended/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>07.06.2025 MoviesApp</title>
  <script type="module" crossorigin src="/mcs-8-mchd-2-advanced-js-blended/index.js"></script>
  <link rel="stylesheet" crossorigin href="/mcs-8-mchd-2-advanced-js-blended/assets/index-C7Vf2KGh.css">
</head>

<body>
  <!-- HEADER -->
  <header class="main-header">
    <div class="container header-content">
      <a href="#" class="logo">🎬 MoviesApp</a>
      <form id="search-form" class="search-form">
        <input type="text" name="movie" id="searchInput" placeholder="Пошук фільмів..." aria-label="Пошук фільмів" />
        <button type="submit">🔍</button>
      </form>
    </div>
  </header>
  <main class="container">
    <div class="main-wrapper">
      <div class="main-title__wrapper">
        <h2 class="main-title" id="main-title">Найпопулярніші фільми за тиждень</h2>
        <button id="reset-btn" class="reset-button">
          🧹 <span>Очистити</span>
        </button>
      </div>
      <ul class="movie-list" id="list-movies"></ul>
      <span class="loader"></span>
      <button id="load-more" class="load-more">Load More</button>
    </div>
  </main>

</body>

</html>
