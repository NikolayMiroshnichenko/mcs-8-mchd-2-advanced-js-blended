<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>07.06.2025 MoviesApp</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>

<body>
  <!-- HEADER -->
  <header class="main-header">
    <div class="container header-content">
      <a href="#" class="logo">🎬 MoviesApp</a>
      <form id="search-form" class="search-form">
        <input type="text" name="movie" id="searchInput" placeholder="Пошук фільмів..." aria-label="Пошук фільмів" />
        <button type="submit">🔍</button>
      </form>
    </div>
  </header>
  <main class="container">
    <div class="main-wrapper">
      <div class="main-title__wrapper">
        <h2 class="main-title" id="main-title">Найпопулярніші фільми за тиждень</h2>
        <button id="reset-btn" class="reset-button">
          🧹 <span>Очистити</span>
        </button>
      </div>
      <ul class=" movie-list" id="list-movies">

      </ul>
      <span class="loader"></span>
    </div>

  </main>

  <script type="module" src="./main.js"></script>
</body>

</html>
